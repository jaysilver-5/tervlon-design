<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tervlon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,400;14..32,440;14..32,500;14..32,560;14..32,620&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ══════════════════════════════════════════════════════════════════
         TERVLON — central app (design, not wired)
         One SPA, a tiny hash router, every nav + tab routes to a real view.
         Light "sky-to-ocean" theme keyed to the logo. Grounded in the
         backend contract: action-gated buttons w/ reasons, async checks
         (queued->result), review gating, tiered activity, the standup as
         the one interruption. Tokens are the single source of truth.
         ══════════════════════════════════════════════════════════════════ */
      :root {
        --bg: #fbfcfe;
        --panel: #ffffff;
        --panel-2: #f6f8fb;
        --well: #f1f5f9;
        --line: #eceff4;
        --line-2: #e2e8ef;
        --line-3: #d4dde6;
        --ink: #0c1a28;
        --ink-2: #44566a;
        --muted: #74879a;
        --faint: #a2b1bf;
        --blue: #1a7ec2;
        --blue-d: #14679f;
        --blue-tint: #eef5fb;
        --blue-tint-2: #e2eef8;
        --blue-line: #cde0ef;
        --b1: #56c6eb;
        --b2: #2e8bce;
        --b3: #155fa0;
        --grad: linear-gradient(152deg, var(--b1) 0%, var(--b2) 50%, var(--b3) 100%);
        --sarah: #6a5fd6;
        --sarah-tint: #efedfc;
        --sarah-line: #d8d2f5;
        --marcus: #178a64;
        --priya: #cf6f3e;
        --james: #3d6fa8;
        --ok: #14935f;
        --ok-tint: #e7f5ee;
        --warn: #b9802c;
        --warn-tint: #fbf2e2;
        --err: #cf4a39;
        --err-tint: #fbeae6;
        --sh-1: 0 1px 2px rgba(12, 26, 40, 0.05);
        --sh-2: 0 6px 20px rgba(12, 26, 40, 0.08);
        --sh-pop: 0 16px 48px rgba(12, 26, 40, 0.18);
        --sh-blue: 0 10px 26px rgba(21, 95, 160, 0.22);
        --serif: "Instrument Serif", Georgia, serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Inter", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        font-size: 13.5px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        letter-spacing: -0.006em;
        overflow: hidden;
      }
      svg { display: block; }
      .ico { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      ::selection { background: rgba(26, 126, 194, 0.16); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb {
        background: var(--line-3); border-radius: 99px;
        border: 3px solid transparent; background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: padding-box; }
      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea { font-family: inherit; }
      .tnum { font-variant-numeric: tabular-nums; }
      .mono { font-family: var(--mono); }
      .serif { font-family: var(--serif); }

      /* type */
      .display { font-size: 32px; line-height: 1.1; font-weight: 620; letter-spacing: -0.028em; }
      .display em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
      .h2 { font-size: 18px; font-weight: 560; letter-spacing: -0.018em; }
      .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .lead { color: var(--ink-2); font-size: 14.5px; line-height: 1.6; }

      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sheen { 0% { background-position: 180% 0; } 100% { background-position: -80% 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
      .rise { animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .fade { animation: fade 0.4s ease both; }
      .stagger > * { animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .stagger > *:nth-child(2) { animation-delay: 0.05s; }
      .stagger > *:nth-child(3) { animation-delay: 0.1s; }
      .stagger > *:nth-child(4) { animation-delay: 0.15s; }
      .stagger > *:nth-child(5) { animation-delay: 0.2s; }
      .stagger > *:nth-child(6) { animation-delay: 0.25s; }

      /* buttons */
      .btn {
        font-weight: 540; font-size: 13px; letter-spacing: -0.01em;
        border: 1px solid transparent; border-radius: 9px; padding: 8px 15px;
        display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
        transition: transform 0.14s, box-shadow 0.18s, background 0.15s, border-color 0.15s, color 0.15s;
      }
      .btn svg { width: 15px; height: 15px; stroke-width: 2; }
      .btn:active { transform: translateY(0.5px); }
      .btn-pri { background: var(--ink); color: #fff; }
      .btn-pri:hover { background: #16293a; transform: translateY(-1px); box-shadow: var(--sh-2); }
      .btn-blue { background: var(--blue); color: #fff; }
      .btn-blue:hover { background: var(--blue-d); transform: translateY(-1px); }
      .btn-violet { background: var(--sarah); color: #fff; }
      .btn-violet:hover { filter: brightness(1.06); transform: translateY(-1px); }
      .btn-ghost { background: var(--panel); color: var(--ink-2); border-color: var(--line-2); }
      .btn-ghost:hover { border-color: var(--line-3); color: var(--ink); transform: translateY(-1px); }
      .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
      .btn:disabled { opacity: 1; cursor: not-allowed; transform: none; background: var(--panel-2); color: var(--faint); border-color: var(--line-2); box-shadow: none; }
      .btn:disabled svg { opacity: 0.6; }

      .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 540; padding: 2.5px 8px; border-radius: 6px; letter-spacing: -0.004em; }
      .chip-line { border: 1px solid var(--line-2); color: var(--ink-2); background: var(--panel); }
      .chip-soft { background: var(--well); color: var(--ink-2); }
      .chip-blue { background: var(--blue-tint); color: var(--blue-d); border: 1px solid var(--blue-line); }
      .chip-ok { background: var(--ok-tint); color: var(--ok); }
      .chip-violet { background: var(--sarah-tint); color: var(--sarah); border: 1px solid var(--sarah-line); }
      .dot { width: 5px; height: 5px; border-radius: 50%; }
      .av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 560; flex-shrink: 0; }

      /* ════════ SHELL ════════ */
      #root { height: 100vh; }
      .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; overflow: hidden; }
      .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; }
      .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 4px; margin-bottom: 14px; cursor: pointer; }
      .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
      .brand-mark svg, .ws-home svg, .si-av svg { width: 100%; height: 100%; }
      .brand-name {
        font-size: 16.5px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink);
        background: linear-gradient(100deg, var(--ink) 0 42%, #5aa6d8 50%, var(--ink) 58% 100%);
        background-size: 220% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: sheen 6s ease-in-out 0.4s 2;
      }
      .nav-sec { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 6px; }
      .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; font-weight: 460; cursor: pointer; transition: background 0.13s, color 0.13s; }
      .nav svg { width: 17px; height: 17px; stroke-width: 1.85; color: var(--muted); transition: color 0.13s; }
      .nav:hover { background: var(--panel-2); color: var(--ink); }
      .nav:hover svg { color: var(--ink-2); }
      .nav.on { background: var(--blue-tint); color: var(--blue-d); font-weight: 540; }
      .nav.on svg { color: var(--blue); }
      .nav-badge { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--blue-d); background: #fff; border: 1px solid var(--blue-line); padding: 0 6px; border-radius: 99px; line-height: 16px; }
      .nav-live { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: livep 2.4s infinite; }
      .rail-foot { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 9px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; transition: background 0.13s; }
      .rail-foot:hover { background: var(--panel-2); }

      .main { overflow-y: auto; position: relative; height: 100vh; }
      .topbar { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 30px; background: rgba(251, 252, 254, 0.8); backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--line); }
      .search { display: flex; align-items: center; gap: 9px; width: 300px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 11px; color: var(--muted); font-size: 13px; cursor: text; }
      .search:hover { border-color: var(--line-3); }
      .search svg { width: 15px; height: 15px; stroke-width: 2; color: var(--faint); }
      .kbd { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 5px; }
      .credits { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line-2); background: var(--panel); border-radius: 9px; padding: 7px 13px; }
      .credits b { color: var(--ink); font-weight: 600; }
      .tb-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); display: grid; place-items: center; color: var(--ink-2); }
      .tb-btn:hover { border-color: var(--line-3); color: var(--ink); }
      .tb-btn svg { width: 17px; height: 17px; stroke-width: 1.9; }
      .page { padding: 32px 40px 64px; max-width: 1140px; }
      .crumb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); margin-bottom: 24px; }
      .crumb svg { width: 13px; height: 13px; stroke-width: 2; }
      .crumb .c-link { cursor: pointer; }
      .crumb .c-link:hover { color: var(--ink-2); }

      /* ════════ HOME ════════ */
      .home-top { display: grid; grid-template-columns: 1fr 372px; gap: 40px; align-items: center; margin-bottom: 14px; }
      .home-intro .display { margin: 16px 0 14px; }
      .home-intro .lead { max-width: 44ch; margin-bottom: 24px; }
      .home-actions { display: flex; gap: 11px; align-items: center; }
      .meta-inline { margin-top: 26px; display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 12.5px; }
      .ppl { display: flex; }
      .ppl .av { border: 2px solid var(--bg); margin-left: -7px; }
      .resume { position: relative; border-radius: 18px; padding: 1px; background: var(--grad); box-shadow: var(--sh-blue); }
      .resume-inner { position: relative; border-radius: 17px; padding: 22px; background: var(--grad); overflow: hidden; color: #eaf5fd; }
      .resume-inner::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 85% -20%, rgba(255,255,255,.34), transparent 58%), linear-gradient(180deg, transparent 40%, rgba(7,42,78,.32)); pointer-events: none; }
      .resume-inner > * { position: relative; }
      .resume .rk { font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.82); display: flex; align-items: center; gap: 7px; }
      .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #d7ffe9; animation: livep 2.4s infinite; }
      @keyframes livep { 0% { box-shadow: 0 0 0 0 rgba(215,255,233,.6); } 70% { box-shadow: 0 0 0 7px rgba(215,255,233,0); } 100% { box-shadow: 0 0 0 0 rgba(215,255,233,0); } }
      .resume h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: #fff; margin: 14px 0 3px; }
      .resume .sub { font-size: 12.5px; color: rgba(234,245,253,.78); }
      .resume .tk { margin: 18px 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
      .bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
      .bar > i { display: block; height: 100%; border-radius: 99px; background: #fff; }
      .resume .foot { margin-top: 8px; display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(234,245,253,.72); }
      .resume .cta { margin-top: 18px; width: 100%; background: #fff; color: var(--blue-d); font-weight: 560; border: none; border-radius: 10px; padding: 11px; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 7px; transition: transform 0.15s; }
      .resume .cta:hover { transform: translateY(-1px); }
      .resume .cta svg { width: 16px; height: 16px; stroke-width: 2.2; }
      .signal { margin-top: 40px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); display: grid; grid-template-columns: repeat(4, 1fr); box-shadow: var(--sh-1); }
      .sg { padding: 20px 24px; border-right: 1px solid var(--line); }
      .sg:last-child { border-right: none; }
      .sg .k { font-size: 12px; color: var(--muted); font-weight: 480; }
      .sg .v { font-size: 27px; font-weight: 600; letter-spacing: -0.03em; margin-top: 7px; color: var(--ink); display: flex; align-items: baseline; gap: 4px; }
      .sg .v small { font-size: 14px; font-weight: 500; color: var(--faint); }
      .sg .d { font-size: 11.5px; margin-top: 4px; color: var(--ok); font-weight: 500; }
      .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 46px 2px 16px; }
      .sec-head .link { font-size: 13px; font-weight: 500; color: var(--blue-d); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
      .sec-head .link svg { width: 14px; height: 14px; stroke-width: 2; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(304px, 1fr)); gap: 16px; }

      /* sprint card */
      .sprint { position: relative; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 20px; cursor: pointer; box-shadow: var(--sh-1); transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s, border-color 0.18s; }
      .sprint::before { content: ""; position: absolute; left: 20px; right: 20px; top: -1px; height: 2px; border-radius: 2px; background: var(--grad); opacity: 0; transition: opacity 0.2s; }
      .sprint:hover { transform: translateY(-3px); box-shadow: var(--sh-2); border-color: var(--line-3); }
      .sprint:hover::before { opacity: 1; }
      .sprint-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .track { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 540; color: var(--ink-2); }
      .track .sq { width: 8px; height: 8px; border-radius: 3px; }
      .lvl { display: inline-flex; gap: 3px; align-items: center; }
      .lvl i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-3); }
      .lvl i.on { background: var(--blue); }
      .sprint h3 { font-size: 15.5px; font-weight: 560; letter-spacing: -0.018em; margin-bottom: 7px; }
      .sprint p { font-size: 13px; color: var(--muted); line-height: 1.55; min-height: 60px; }
      .sprint-foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
      .sprint-foot .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line-3); }
      .sprint-foot .ppl { margin-left: auto; }
      .sprint-foot .ppl .av { border: 2px solid var(--panel); }
      .flag-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--blue-d); background: var(--blue-tint); border: 1px solid var(--blue-line); padding: 2px 7px; border-radius: 6px; }
      .tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--well); border: 1px solid var(--line); border-radius: 11px; margin-bottom: 22px; }
      .tab { font-size: 13px; font-weight: 500; padding: 7px 15px; border-radius: 8px; color: var(--ink-2); border: none; background: transparent; transition: background 0.14s, color 0.14s, box-shadow 0.14s; }
      .tab:hover { color: var(--ink); }
      .tab.on { background: var(--panel); color: var(--ink); font-weight: 560; box-shadow: var(--sh-1); }
      .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--faint); }

      /* ── developer dashboard (premium, credential tone) ── */
      .greet { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
      .greet .display { font-size: 30px; margin-top: 7px; }
      .greet .display em { color: var(--ink); }
      .greet-r { display: flex; align-items: center; gap: 10px; }
      .avl { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 99px; padding: 6px 13px; background: var(--panel); }
      /* continue — horizontal gradient focal */
      .continue { position: relative; border-radius: 18px; padding: 1px; background: var(--grad); box-shadow: var(--sh-blue); margin-bottom: 26px; }
      .continue-in { position: relative; border-radius: 17px; padding: 22px 26px; background: var(--grad); overflow: hidden; color: #eaf5fd; display: flex; align-items: center; gap: 28px; }
      .continue-in::before { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 120% at 92% -10%, rgba(255,255,255,.32), transparent 55%); pointer-events: none; }
      .continue-in > * { position: relative; }
      .continue .l { flex: 1; min-width: 0; }
      .continue .rk { font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.82); display: flex; align-items: center; gap: 7px; }
      .continue h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #fff; margin: 9px 0 2px; }
      .continue .sub { font-size: 12.5px; color: rgba(234,245,253,.8); }
      .continue .cnote { font-size: 12px; color: rgba(234,245,253,.86); margin-top: 10px; max-width: 52ch; line-height: 1.5; }
      .continue .pwrap { display: flex; align-items: center; gap: 14px; margin-top: 16px; max-width: 460px; }
      .continue .pwrap .bar { flex: 1; }
      .continue .pmeta { font-size: 11.5px; color: rgba(234,245,253,.78); white-space: nowrap; }
      .continue .r { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
      .continue .rbtn { background: #fff; color: var(--blue-d); font-weight: 560; border: none; border-radius: 11px; padding: 12px 20px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px rgba(8,40,72,.24); transition: transform 0.15s; }
      .continue .rbtn:hover { transform: translateY(-1.5px); }
      .continue .rbtn svg { width: 16px; height: 16px; stroke-width: 2.2; }
      .continue .ppl .av { border: 2px solid rgba(255,255,255,.35); }

      .dash-grid { display: grid; grid-template-columns: 1fr 332px; gap: 20px; align-items: start; }
      .pnl { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--sh-1); }
      .pnl-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
      .pnl-h .t { font-size: 13.5px; font-weight: 560; letter-spacing: -0.01em; }
      .pnl-h .x { font-size: 11.5px; color: var(--muted); }
      .pnl-h .link { font-size: 12.5px; color: var(--blue-d); font-weight: 500; cursor: pointer; }
      /* skill evidence track rows */
      .trk { display: flex; align-items: center; gap: 16px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
      .trk:last-child { border-bottom: none; }
      .trk .ti { display: flex; align-items: center; gap: 10px; width: 150px; flex-shrink: 0; }
      .trk .sq { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
      .trk .tn { font-size: 13px; font-weight: 540; }
      .trk .tl2 { font-size: 11px; color: var(--muted); }
      .trk .spark { flex: 1; display: flex; align-items: center; justify-content: center; }
      .trk .tv { width: 86px; text-align: right; flex-shrink: 0; }
      .trk .tv b { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
      .trk .tv .vr { font-size: 10.5px; color: var(--muted); }
      .trk.empty .tn, .trk.empty .tv b { color: var(--faint); }
      .lvl-chip { font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--blue-tint); color: var(--blue-d); }
      /* history table */
      .htab { width: 100%; border-collapse: collapse; }
      .htab td, .htab th { padding: 12px 20px; text-align: left; border-bottom: 1px solid var(--line); }
      .htab th { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
      .htab tr:last-child td { border-bottom: none; }
      .htab tbody tr { cursor: pointer; transition: background 0.12s; }
      .htab tbody tr:hover { background: var(--panel-2); }
      .htab .hs { font-weight: 600; font-variant-numeric: tabular-nums; }
      .htab .ht2 { font-size: 13px; font-weight: 500; }
      .band-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 540; padding: 2px 9px; border-radius: 99px; }
      /* featured credential cards */
      .cred { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 13px; align-items: center; cursor: pointer; transition: background 0.12s; }
      .cred:hover { background: var(--panel-2); }
      .cred:last-child { border-bottom: none; }
      .cred .ring { width: 48px; height: 48px; position: relative; flex-shrink: 0; }
      .cred .ring .rn { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 650; }
      .cred .ct { font-size: 13px; font-weight: 540; letter-spacing: -0.01em; }
      .cred .cs { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
      .cred .vbadge { margin-left: auto; color: var(--ok); flex-shrink: 0; }
      .cred .vbadge svg { width: 17px; height: 17px; }
      .evsum { display: grid; grid-template-columns: repeat(3, 1fr); }
      .evsum .e { padding: 16px; text-align: center; border-right: 1px solid var(--line); }
      .evsum .e:last-child { border-right: none; }
      .evsum .ev2 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
      .evsum .el { font-size: 11px; color: var(--muted); margin-top: 2px; }

      /* ════════ WORKSPACE ════════ */
      .ws { display: grid; grid-template-rows: 53px 1fr 27px; height: 100vh; }
      .ws-top { display: flex; align-items: center; gap: 13px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
      .ws-home { display: flex; align-items: center; gap: 9px; padding-right: 13px; border-right: 1px solid var(--line); height: 30px; cursor: pointer; }
      .ws-home .mark { width: 24px; height: 24px; }
      .ws-id .t { font-size: 13.5px; font-weight: 560; letter-spacing: -0.02em; line-height: 1.2; }
      .ws-id .s { font-size: 11px; color: var(--muted); }
      .presence { display: flex; align-items: center; margin-left: 2px; }
      .presence .av { width: 27px; height: 27px; font-size: 10px; border: 2px solid var(--panel); margin-left: -6px; position: relative; }
      .presence .av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); border: 1.5px solid var(--panel); }
      .presence .av.off::after { background: var(--faint); }

      .ws-main { display: grid; grid-template-columns: 296px 1fr 340px; min-height: 0; }
      .col { min-height: 0; display: flex; flex-direction: column; }
      .col-task { background: var(--panel); border-right: 1px solid var(--line); }
      .col-center { min-width: 0; background: var(--bg); }
      .col-dock { background: var(--panel); border-left: 1px solid var(--line); }
      .pane-h { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }

      /* TASK panel (the explicit brief) */
      .task { overflow-y: auto; flex: 1; padding: 18px 16px 22px; }
      .task-id { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .task-id .mono { font-size: 12px; color: var(--blue-d); font-weight: 500; }
      .task h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.25; margin-bottom: 10px; }
      .task .brief { font-size: 13px; color: var(--ink-2); line-height: 1.6; background: var(--blue-tint); border: 1px solid var(--blue-line); border-radius: 11px; padding: 12px 13px; }
      .task .brief b { color: var(--ink); font-weight: 560; }
      .task-sec { margin-top: 20px; }
      .task-sec > .lab { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; }
      .task-sec > .lab .n { margin-left: auto; color: var(--faint); }
      .crit { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 11px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
      .crit .tick { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; transition: background 0.2s, border-color 0.2s; }
      .crit.done .tick { background: var(--ok); color: #fff; }
      .crit.todo .tick { border: 1.5px solid var(--line-3); }
      .crit.todo { color: var(--muted); }
      .crit .tick svg { width: 9px; height: 9px; stroke-width: 3; }
      .file-pill { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 9px; margin-bottom: 7px; cursor: pointer; font-size: 12.5px; transition: border-color 0.14s, background 0.14s; }
      .file-pill:hover { border-color: var(--blue-line); background: var(--blue-tint); }
      .file-pill svg { width: 14px; height: 14px; stroke-width: 1.9; color: var(--muted); }
      .file-pill .mono { font-size: 11.5px; color: var(--ink-2); }
      .file-pill .edit-dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
      .hint { display: flex; gap: 9px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 11px; }
      .hint .av { width: 26px; height: 26px; font-size: 9.5px; }
      .hint .ht { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
      .hint .ht .nm { font-weight: 560; color: var(--marcus); }
      .task-actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-shrink: 0; background: var(--panel); }
      .task-actions .btn { flex: 1; }

      /* center: editor + terminal */
      .editor-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .tabbar { height: 37px; display: flex; align-items: stretch; background: var(--panel-2); border-bottom: 1px solid var(--line); flex-shrink: 0; }
      .ftab { display: flex; align-items: center; gap: 7px; padding: 0 14px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); cursor: pointer; position: relative; }
      .ftab.on { background: var(--bg); color: var(--ink); }
      .ftab.on::after { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--blue); }
      .ftab .lang { width: 7px; height: 7px; border-radius: 2px; background: var(--blue); }
      .ftab .x { color: var(--faint); font-size: 14px; line-height: 1; margin-left: 2px; }
      .editor { flex: 1; min-height: 0; display: grid; grid-template-columns: 170px 1fr; background: var(--bg); }
      .tree { border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; font-size: 12px; background: var(--panel-2); }
      .tnode { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 7px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
      .tnode:hover { background: var(--well); }
      .tnode.on { background: var(--blue-tint); color: var(--blue-d); font-weight: 500; }
      .tnode.dir { color: var(--muted); font-weight: 500; }
      .tnode svg { width: 14px; height: 14px; stroke-width: 1.9; flex-shrink: 0; }
      .code { overflow: auto; min-width: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; padding: 12px 0; background: var(--panel); }
      .line { display: flex; padding: 0 16px 0 0; }
      .line:hover { background: var(--panel-2); }
      .ln { width: 44px; flex-shrink: 0; text-align: right; padding-right: 16px; color: var(--faint); user-select: none; }
      .cl { white-space: pre; }
      .k { color: #1457a0; } .ty { color: var(--blue); } .st { color: var(--marcus); }
      .nu { color: var(--warn); } .fn { color: var(--sarah); } .cm { color: var(--faint); font-style: italic; } .pn { color: var(--ink-2); }

      /* IDE terminal */
      .terminal { height: 210px; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; }
      .term-h { height: 36px; display: flex; align-items: stretch; padding: 0 6px 0 0; border-bottom: 1px solid var(--line); flex-shrink: 0; }
      .term-tab { font-size: 11.5px; font-weight: 540; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 0 14px; border-right: 1px solid var(--line); position: relative; }
      .term-tab.on { color: var(--ink); background: var(--panel); }
      .term-tab.on::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--blue); }
      .term-tab .ct { font-size: 9.5px; font-weight: 600; color: #fff; border-radius: 99px; padding: 0 5px; line-height: 14px; }
      .term-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
      .term-tools .tt { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); }
      .term-tools .tt:hover { background: var(--well); color: var(--ink-2); }
      .term-tools .tt svg { width: 14px; height: 14px; stroke-width: 2; }
      .term-body { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 12px; line-height: 1.65; padding: 9px 13px; color: var(--ink-2); }
      .term-body .row { white-space: pre-wrap; word-break: break-word; }
      .tp { color: var(--ok); font-weight: 500; }
      .tu { color: var(--blue); }
      .tg { color: var(--faint); }
      .tw { color: var(--warn); }
      .te { color: var(--err); }
      .tok { color: var(--ok); }
      .term-input { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
      .term-input .pr { color: var(--ok); font-weight: 500; white-space: nowrap; }
      .term-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 12px; padding: 0; }
      .cursor-hint { color: var(--faint); }

      /* problems / checks panel */
      .checks { padding: 12px 13px; font-family: var(--sans); }
      .check-running { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink-2); background: var(--blue-tint); border: 1px solid var(--blue-line); border-radius: 9px; padding: 9px 12px; margin-bottom: 12px; }
      .spinner { width: 14px; height: 14px; border: 2px solid var(--blue-line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
      .sig { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
      .sig:last-child { border-bottom: none; }
      .sig .si { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
      .sig.pass .si { background: var(--ok); color: #fff; }
      .sig.fail .si { background: var(--warn-tint); color: var(--warn); border: 1px solid var(--warn); }
      .sig .st2 { font-weight: 540; }
      .sig .sh { color: var(--muted); font-size: 11.5px; }
      .checks .note { font-size: 11px; color: var(--faint); margin-top: 12px; }

      /* dock */
      .dock-tabs { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; padding: 0 4px; }
      .dock-tab { flex: 1; padding: 12px 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; display: flex; align-items: center; justify-content: center; gap: 5px; }
      .dock-tab svg { width: 15px; height: 15px; stroke-width: 1.9; }
      .dock-tab.on { color: var(--ink); border-bottom-color: var(--blue); }
      .dock-tab .badge { background: var(--blue); color: #fff; font-size: 9px; font-weight: 600; border-radius: 99px; padding: 0 4px; line-height: 14px; }
      .dock-body { flex: 1; overflow-y: auto; min-height: 0; }

      /* dock: board */
      .board { padding: 6px 12px 16px; }
      .board-group { margin-top: 14px; }
      .board-group:first-child { margin-top: 6px; }
      .bg-h { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .bg-h .n { margin-left: auto; color: var(--faint); }
      .tk { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 12px; margin-bottom: 7px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
      .tk:hover { border-color: var(--line-3); box-shadow: var(--sh-1); }
      .tk.active { border-color: var(--blue-line); background: linear-gradient(180deg, var(--blue-tint), var(--panel) 70%); box-shadow: 0 0 0 1px var(--blue-line), var(--sh-1); }
      .tk.done { opacity: 0.62; }
      .tk-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
      .tk-id { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--muted); }
      .tk.active .tk-id { color: var(--blue-d); }
      .tk-title { font-size: 12.5px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.35; }
      .tk-owner { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 10.5px; color: var(--muted); }
      .tk-owner .av { width: 17px; height: 17px; font-size: 8px; }
      .status-led { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

      /* dock: chat */
      .chan { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
      .msg { display: flex; gap: 9px; }
      .msg .av { width: 26px; height: 26px; font-size: 9.5px; margin-top: 1px; }
      .msg-h { display: flex; align-items: baseline; gap: 7px; margin-bottom: 2px; }
      .msg-h .nm { font-size: 12.5px; font-weight: 560; }
      .msg-h .ti { font-size: 10.5px; color: var(--faint); }
      .msg-t { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
      .msg-t code { font-family: var(--mono); font-size: 11px; background: var(--well); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
      .typing { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
      .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); animation: td 1.3s ease infinite; }
      .typing i:nth-child(2) { animation-delay: 0.18s; } .typing i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes td { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.7); } 40% { opacity: 1; transform: scale(1); } }
      .composer { border-top: 1px solid var(--line); padding: 10px; flex-shrink: 0; }
      .composer .box { border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
      .composer .box:hover { border-color: var(--line-3); }
      .composer input { flex: 1; border: none; outline: none; background: transparent; color: var(--ink); font-size: 12.5px; }

      /* dock: references */
      .ref { padding: 12px; }
      .ref-search { border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 11px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .ref-search svg { width: 14px; height: 14px; stroke-width: 2; color: var(--faint); }
      .ref-card { border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.14s, box-shadow 0.14s; }
      .ref-card:hover { border-color: var(--blue-line); box-shadow: var(--sh-1); }
      .ref-kind { font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--well); color: var(--muted); }
      .ref-card.tagged .ref-kind { background: var(--blue-tint); color: var(--blue-d); }
      .ref-t { font-size: 12.5px; font-weight: 540; margin: 8px 0 3px; letter-spacing: -0.01em; }
      .ref-s { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

      /* dock: activity (tiered) */
      .activity { padding: 14px; }
      .ev { display: flex; gap: 10px; padding: 6px 2px; font-size: 12px; color: var(--ink-2); align-items: flex-start; }
      .ev .erail { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; align-self: stretch; }
      .ev .ed { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; background: var(--line-3); flex-shrink: 0; }
      .ev.active .ed { background: var(--warn); }
      .ev.info .ed { background: var(--blue); }
      .ev .eln { width: 1.5px; flex: 1; background: var(--line); margin-top: 3px; }
      .ev:last-child .eln { display: none; }
      .ev .et { flex: 1; line-height: 1.45; padding-bottom: 4px; }
      .ev .time { color: var(--faint); font-size: 10.5px; }
      .ev .who { font-weight: 560; color: var(--ink); }
      .tier-key { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
      .tier-key span { display: inline-flex; align-items: center; gap: 5px; }

      /* status bar */
      .statusbar { display: flex; align-items: center; gap: 16px; padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
      .sb-item { display: flex; align-items: center; gap: 6px; }
      .sb-led { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: sbp 2.6s infinite; }
      @keyframes sbp { 0% { box-shadow: 0 0 0 0 rgba(20,147,95,.45); } 70% { box-shadow: 0 0 0 6px rgba(20,147,95,0); } 100% { box-shadow: 0 0 0 0 rgba(20,147,95,0); } }

      /* toast (active tier) */
      .toasts { position: fixed; top: 64px; right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 10px; width: 322px; }
      .toast { background: var(--panel); border: 1px solid var(--line-2); border-left: 3px solid var(--james); border-radius: 12px; box-shadow: var(--sh-pop); padding: 13px 14px; animation: rise 0.5s cubic-bezier(0.16,1,0.3,1) both; }
      .toast .th { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .toast .th .nm { font-size: 12.5px; font-weight: 560; }
      .toast .th .tier { margin-left: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--james); }
      .toast p { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
      .toast .ta { display: flex; gap: 8px; margin-top: 11px; }

      /* ════════ STANDUP ════════ */
      .standup-incoming { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(12, 18, 30, 0.42); backdrop-filter: blur(8px); animation: fade 0.3s ease; }
      .si-card { width: 392px; background: var(--panel); border: 1px solid var(--sarah-line); border-radius: 20px; padding: 28px; text-align: center; box-shadow: var(--sh-pop), 0 0 60px rgba(106, 95, 214, 0.14); position: relative; overflow: hidden; animation: rise 0.45s cubic-bezier(0.16,1,0.3,1) both; }
      .si-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 110px; background: radial-gradient(120% 100% at 50% 0%, var(--sarah-tint), transparent 70%); }
      .si-card > * { position: relative; }
      .si-ring { width: 84px; height: 84px; margin: 6px auto 16px; position: relative; }
      .si-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .si-av { position: absolute; inset: 11px; }
      .si-kick { font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sarah); margin-bottom: 14px; }
      .si-card h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
      .si-host { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
      .si-ctx { font-size: 12px; color: var(--sarah); background: var(--sarah-tint); border: 1px solid var(--sarah-line); border-radius: 9px; padding: 8px 11px; margin: 14px 4px 0; line-height: 1.5; }
      .si-p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 12px 0 0; }
      .si-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
      .si-sub { font-size: 10px; color: var(--faint); margin-top: 9px; }

      /* the standup is a minimizable modal over the (preserved) workspace */
      .meet-layer { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(12,18,30,.46); backdrop-filter: blur(9px); transition: background .35s, backdrop-filter .35s; animation: fade .3s ease; }
      .meet-layer.minimized { background: transparent; backdrop-filter: none; pointer-events: none; place-items: end; padding: 20px; }

      function spark(vals, w = 96, h = 28) {
        if (!vals || vals.length < 2) return `<span style="font-size:11px;color:var(--faint)">building…</span>`;
        const mx = Math.max(...vals), mn = Math.min(...vals), rng = mx - mn || 1;
        const y = (v) => h - 3 - ((v - mn) / rng) * (h - 6);
        const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${y(v)}`).join(" ");
        const lx = w, ly = y(vals[vals.length - 1]);
        return `<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="var(--blue)"/></svg>`;

      /* ════════════════ WORKSPACE ════════════════ */
      const CODE = [
        ["import", " { Request, Response, NextFunction } ", "from", " 'express';"],
        ["import", " jwt ", "from", " 'jsonwebtoken';"],
        [],
        ["export interface", " AuthRequest ", "extends", " Request {"],
        ["  userId?: ", "ty", "string", ";"],
        ["}"],
        [],
        ["cm", "// T-03 — reusable JWT bearer auth. 401 on missing/bad header,"],
        ["cm", "// verify with JWT_SECRET, attach userId, distinct expired branch."],
        ["export const", " authGuard = (req: AuthRequest, res: Response, next: NextFunction) => {"],
        ["  const", " header = req.headers.authorization;"],
        ["  if", " (!header || !header.", "fn", "startsWith", "('Bearer ')) {"],
        ["    return", " res.", "fn", "status", "(", "nu", "401", ").json({ error: ", "st", "'NO_TOKEN'", " });"],
        ["  }"],
        ["  const", " token = header.", "fn", "slice", "(", "nu", "7", ");"],
        ["  try", " {"],
        ["    const", " payload = jwt.", "fn", "verify", "(token, process.env.JWT_SECRET!);"],
        ["    req.userId = (payload ", "k", "as", " any).userId;"],
        ["    return", " ", "fn", "next", "();"],
        ["  } ", "k", "catch", " (err) {"],
        ["    cm", "// TODO: branch TokenExpiredError -> distinct 401 TOKEN_EXPIRED"],
        ["    return", " res.", "fn", "status", "(", "nu", "401", ").json({ error: ", "st", "'INVALID_TOKEN'", " });"],
        ["  }"],
        ["};"],
      ];
      const CLS = new Set(["k", "ty", "st", "nu", "fn", "cm", "pn"]);
      const KW = ["import", "from", "export interface", "extends", "export const", "const", "if", "return", "try", "catch"];
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      function renderLine(parts) {
        if (!parts.length) return "&nbsp;";
        if (parts[0] === "cm") return `<span class="cm">${esc(parts[1])}</span>`;
        let html = "";
        for (let i = 0; i < parts.length; i++) {
          let seg = parts[i];
          if (CLS.has(seg)) html += `<span class="${seg}">${esc(parts[++i])}</span>`;
          else {
            let s = esc(seg);
            KW.forEach((kw) => { s = s.replace(new RegExp("^(\\s*)(" + kw + ")\\b"), '$1<span class="k">$2</span>'); });
            html += s;
          }
        }
        return html;
      }
      const codeHtml = () =>
        CODE.map((p, i) => `<div class="line"><span class="ln">${i + 1}</span><span class="cl">${renderLine(p)}</span></div>`).join("");

      /* ════════════════ ROUTER ════════════════ */
      const VIEWS = { home: viewHome, catalog: viewCatalog, workspace: viewWorkspace, scorecard: viewScorecard };
      function render() {
        const root = document.getElementById("root");
        root.innerHTML = (VIEWS[S.route] || viewHome)();
        if (S.route === "workspace" && !S.toastShown) {
          // an 'active'-tier pairing toast — the only thing louder is a standup
          setTimeout(showPairingToast, 1400);
        }
        const m = document.querySelector(".main");
        if (m) m.scrollTo({ top: 0 });
      }
      function nav(route, opts = {}) {
        if (opts.dock) S.dock = opts.dock;
        S.route = route;
        location.hash = "#/" + route;
        render();
      }
      window.addEventListener("hashchange", () => {
        const r = (location.hash.replace(/^#\//, "") || "home").split("?")[0];
        if (VIEWS[r] && r !== S.route) { S.route = r; render(); }
      });

      /* ════════════════ INTERACTIONS ════════════════ */
      function focusEl(id) { const el = document.getElementById(id); if (el) el.focus(); }
      function showPairingToast() {
        S.toastShown = true;
        const t = document.getElementById("toasts");
        if (!t) return;
        t.innerHTML = `<div class="toast"><div class="th">${av("james", 22)}<span class="nm">James · Reviewer</span><span class="tier">Active</span></div><p>Pairing offer: want me to look at the expired-token branch with you? You keep the keyboard.</p><div class="ta"><button class="btn btn-blue btn-sm" data-toast="x">Accept</button><button class="btn btn-ghost btn-sm" data-toast="x">Not now</button></div></div>`;
      }

      function runChecks() {
        if (S.checks === "running") return;
        S.checks = "running";
        S.term = "problems";
        updateTerminal();
        const rb = document.getElementById("run-btn");
        if (rb) { rb.disabled = true; rb.innerHTML = `<span class="spinner" style="border-color:var(--line-3);border-top-color:var(--ink-2)"></span> Queued…`; }
        setTimeout(() => {
          S.checks = "passed";
          S.reviewReq = true;
          TICKET.criteria.forEach((c) => (c.done = true));
          // refresh task panel + terminal + board in place
          const tp = document.querySelector(".col-task");
          if (tp) tp.outerHTML = taskPanel();
          updateTerminal();
          if (S.dock === "board") { const db = document.getElementById("dock-body"); if (db) db.innerHTML = dockBoard(); }
          wireWorkspace();
        }, 2100);
      }
      function updateTerminal() {
        const t = document.querySelector(".terminal");
        if (t) t.outerHTML = terminal();
        wireWorkspace();
        const b = document.getElementById("term-body");
        if (b) b.scrollTop = b.scrollHeight;
      }

      /* IDE terminal command handling */
      function runTermCmd(cmd) {
        const c = cmd.trim();
        const prompt = `<span class="pr">dev@tervlon:~/project$</span> ${esc(c)}`;
        let out = [];
        if (c === "") out = [];
        else if (c === "clear" || c === "cls") { S.termLines = []; return; }
        else if (c === "help") out = [`<span class="tg">commands:</span> ls · cat &lt;file&gt; · pwd · node -v · git status · npm install · npm run dev · npm test · clear`];
        else if (c === "ls") out = [`<span class="tu">src</span>  package.json  tsconfig.json  __tervlon_tests__`];
        else if (c === "pwd") out = [`/home/dev/project`];
        else if (c === "whoami") out = [`dev`];
        else if (c === "node -v") out = [`v20.11.0`];
        else if (/^git status/.test(c)) out = [`<span class="tg">On branch sprint/ecommerce</span>`, `Changes not staged:`, `  <span class="tw">modified:</span> src/middleware/auth.guard.ts`];
        else if (/^cat /.test(c)) out = [`<span class="tg">— ${esc(c.slice(4))} (open it in the editor to edit) —</span>`];
        else if (/^npm i(nstall)?$/.test(c)) out = [`<span class="tg">added 214 packages in 3.2s</span>`, `<span class="tok">✓</span> dependencies ready`];
        else if (/^npm run dev/.test(c)) out = [`<span class="tg">&gt; ts-node-dev src/index.ts</span>`, `<span class="tok">API on :3000</span>`, `<span class="tg">watching for changes…</span>`];
        else if (/^npm( run)? test/.test(c)) {
          out = [`<span class="tg">&gt; jest --runInBand</span>`, `<span class="tok">PASS</span> header-missing returns 401`, `<span class="tok">PASS</span> valid token attaches userId`, S.checks === "passed" ? `<span class="tok">PASS</span> expired → TOKEN_EXPIRED` : `<span class="te">FAIL</span> expired token <span class="tg">— expected TOKEN_EXPIRED</span>`, `<span class="tg">queued on the isolated runner — full signals in the Problems tab.</span>`];
        } else out = [`<span class="te">command not found:</span> ${esc(c.split(" ")[0])}`];
        S.termLines = (S.termLines.length ? S.termLines : DEFAULT_TERM.slice()).concat([prompt, ...out]);
      }

      // event delegation
      document.addEventListener("click", (e) => {
        const routeEl = e.target.closest("[data-route]");
        if (routeEl) {
          const dk = routeEl.getAttribute("data-dock");
          return nav(routeEl.getAttribute("data-route"), dk ? { dock: dk } : {});
        }
        const tab = e.target.closest(".tab");
        if (tab) { catTrack = tab.getAttribute("data-track"); render(); return; }
        const rv = e.target.closest("[data-repview]");
        if (rv) { S.repView = rv.getAttribute("data-repview"); render(); return; }
        const dt = e.target.closest(".dock-tab");
        if (dt) { S.dock = dt.getAttribute("data-dock"); document.querySelector(".col-dock").outerHTML = dock(); wireWorkspace(); return; }
        const tt = e.target.closest(".term-tab");
        if (tt) { S.term = tt.getAttribute("data-term"); updateTerminal(); return; }
        if (e.target.closest("#run-btn")) return runChecks();
        if (e.target.closest("#review-btn") && !e.target.closest("#review-btn").disabled) return requestReview();
        if (e.target.closest("#term-clear")) { S.termLines = []; updateTerminal(); return; }
        if (e.target.closest("#standup-btn")) return openStandupIncoming();
        if (e.target.closest("[data-toast]")) { const t = document.getElementById("toasts"); if (t) t.innerHTML = ""; return; }
        const fp = e.target.closest(".file-pill,[data-file]");
        if (fp && S.route === "workspace") { /* already open */ return; }
        // standup
        const qp = e.target.closest(".qp");
        if (qp) { const i = document.getElementById("tr-in"); if (i) { i.value = qp.getAttribute("data-qp"); i.focus(); } return; }
        if (e.target.closest("#tr-send")) return sendTurn();
        if (e.target.closest("#meet-min")) { document.getElementById("meet-layer")?.classList.add("minimized"); return; }
        if (e.target.closest("#meet-pill")) { const l = document.getElementById("meet-layer"); if (l) { l.classList.remove("minimized"); setTimeout(() => focusEl("tr-in"), 60); } return; }
        if (e.target.closest("#wrap-btn")) { document.getElementById("meet-layer")?.remove(); meetState = null; return nav("scorecard"); }
        if (e.target.closest(".si-go")) { const l = document.getElementById("si-layer"); if (l) { clearInterval(l._t); l.remove(); } return openMeet(); }
        if (e.target.closest("#si-delay")) { const l = document.getElementById("si-layer"); if (l) { clearInterval(l._t); l.remove(); } return; }
        if (e.target.closest("#report-btn") && !e.target.closest("#report-btn").disabled) return nav("scorecard");
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.id === "term-in" && e.key === "Enter") {
          runTermCmd(e.target.value);
          updateTerminal();
          setTimeout(() => focusEl("term-in"), 0);
        }
        if (e.target.id === "tr-in" && e.key === "Enter") sendTurn();
      });

      function requestReview() {
        S.reportReady = false;
        // James reviews -> show narrative toast, then enable report after standup
        const rb = document.getElementById("review-btn");
        if (rb) { rb.disabled = true; rb.innerHTML = `<span class="spinner" style="border-color:var(--line-3);border-top-color:var(--ink-2)"></span> James is reviewing…`; }
        const t = document.getElementById("toasts");
        if (t) t.innerHTML = `<div class="toast" style="border-left-color:var(--james)"><div class="th">${av("james", 22)}<span class="nm">James · Reviewer</span><span class="tier">Active</span></div><p><b>“Clean separation — I'd merge this.”</b> Two minor naming notes inline. Nice work on the expired branch.</p><div class="ta"><button class="btn btn-ghost btn-sm" data-toast="x">View review</button></div></div>`;
        setTimeout(() => {
          if (rb) { rb.innerHTML = `${svg(icon.check, 15, 2)} Reviewed ✓`; }
          openStandupIncoming();
        }, 2200);
      }

      function openStandupIncoming() {
        if (document.getElementById("si-layer")) return;
        const C = 2 * Math.PI * 38;
        const layer = document.createElement("div");
        layer.className = "standup-incoming";
        layer.id = "si-layer";
        layer.innerHTML = `<div class="si-card">
          <div class="si-kick">Standup · the floor is hers</div>
          <div class="si-ring"><svg width="84" height="84"><circle cx="42" cy="42" r="38" fill="none" stroke="var(--well)" stroke-width="3"/><circle id="si-arc" cx="42" cy="42" r="38" fill="none" stroke="var(--sarah)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/></svg><div class="si-av">${av("sarah", 62)}</div></div>
          <h3>Sarah is calling a standup</h3>
          <div class="si-host">Sarah Chen · Engineering Lead · Daily Standup</div>
          <div class="si-ctx">Comprehension check — she'll ask about ${TICKET.id}, the auth guard you just wrote.</div>
          <p class="si-p">Take a breath. She'll ask you to walk through your work. Joining by voice in <span class="mono" style="color:var(--sarah);font-weight:600" id="si-n">8s</span>.</p>
          <div class="si-actions"><button class="btn btn-violet si-go">${svg(icon.mic, 15, 2)} Join standup</button>
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" id="si-delay" style="flex:1">Need 30s</button><button class="btn btn-ghost si-go" style="flex:1">Join in text</button></div></div>
          <div class="si-sub">A delay, not a dismissal — she'll pull you in after.</div>
        </div>`;
        document.getElementById("root").appendChild(layer);
        let n = 8;
        const arc = document.getElementById("si-arc");
        const t = setInterval(() => {
          n--;
          const el = document.getElementById("si-n");
          if (el) el.textContent = n + "s";
          if (arc) arc.style.strokeDashoffset = C * (1 - n / 8);
          if (n <= 0) { clearInterval(t); if (document.getElementById("si-layer")) { layer.remove(); openMeet(); } }
        }, 1000);
        layer._t = t;
      }

      function sendTurn() {
        const i = document.getElementById("tr-in");
        if (!i || !i.value.trim() || meetState.done) return;
        const val = i.value.trim();
        meetState.lines.push({ who: "you", t: val });
        meetState.turn++;
        i.value = "";
        meetState.speaker = "you";
        repaintMeet();
        // advance scripted replies
        setTimeout(() => {
          const next = [];
          if (meetState.turn === 1) next.push(STANDUP_SCRIPT[1]);
          else if (meetState.turn === 2) next.push(STANDUP_SCRIPT[2], STANDUP_SCRIPT[3]);
          else next.push(STANDUP_SCRIPT[4]);
          let d = 0;
          next.forEach((m) => {
            setTimeout(() => {
              meetState.lines.push(m);
              meetState.speaker = m.who;
              if (meetState.turn >= 3 && m === next[next.length - 1]) meetState.done = true;
              repaintMeet();
            }, d);
            d += 750;
          });
        }, 350);
      }
      function repaintMeet() {
        const body = document.getElementById("tr-body");
        if (body) { body.innerHTML = meetState.lines.map(trLine).join(""); body.scrollTop = body.scrollHeight; }
        const foot = document.getElementById("tr-foot");
        if (foot) foot.innerHTML = meetFoot();
        document.querySelectorAll(".tile").forEach((el) => {
          el.classList.toggle("spk", el.getAttribute("data-tile") === meetState.speaker);
        });
        // keep the minimized pill + header presence in sync
        const speaking = meetState.speaker !== "you";
        const who = speaking ? PEOPLE[meetState.speaker].name.split(" ")[0] : "You";
        const mps = document.getElementById("mp-s");
        if (mps) mps.textContent = meetState.done ? "Ready to wrap" : speaking ? who + " is speaking…" : "Your turn";
        const live = document.getElementById("mh-live");
        if (live) live.innerHTML = `<span class="dot" style="background:var(--ok)"></span> ${meetState.done ? "wrapping up" : speaking ? who + " is speaking" : "she's listening"}`;
        if (!meetState.done) setTimeout(() => focusEl("tr-in"), 30);
      }

      function wireWorkspace() { /* listeners are delegated; hook kept for in-place refreshes */ }

      /* ════════════════ BOOT ════════════════ */
      (function boot() {
        const r = (location.hash.replace(/^#\//, "") || "home").split("?")[0];
        S.route = VIEWS[r] ? r : "home";
        render();
      })();
    </script>
  </body>
</html>
