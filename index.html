      /* ── motion ── */
      @keyframes fade-up {

        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scale-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes slide-r {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes drop-in {
        from {
          opacity: 0;
          transform: translateY(-16px);
        }
        to {
          opacity: 1;

        }
      }
      @keyframes sheet-up {
        from {
          transform: translateY(100%);
        }

          transform: none;
        }
      }
      @keyframes blink {
        0%,

          opacity: 1;
        }

        100% {
          opacity: 0;

      }
      @keyframes spin {

      }
      @keyframes pulse-ring {
        0% {
          box-shadow: 0 0 0 0 var(--ring, rgba(242, 169, 59, 0.45));
        }
        70% {
          box-shadow: 0 0 0 7px transparent;
        }

          box-shadow: 0 0 0 0 transparent;
        }
      }
      @keyframes pulse-cy {
        0% {
          box-shadow: 0 0 0 0 rgba(242, 169, 59, 0.5);
        }
        70% {
          box-shadow: 0 0 0 6px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @keyframes sarah-breathe {
        0%,
        100% {
          box-shadow:
            0 0 0 1px rgba(169, 159, 254, 0.25),
            0 0 28px rgba(169, 159, 254, 0.12);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(169, 159, 254, 0.4),
            0 0 52px rgba(169, 159, 254, 0.3);
        }
      }
      @keyframes dot {
        0%,
        80%,
        100% {
          opacity: 0.2;
          transform: scale(0.7);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes wv {
        0%,
        100% {
          height: 3px;
        }
        50% {
          height: var(--h, 14px);
        }
      }
      @keyframes bar-grow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      .fu {
        animation: fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .stagger > * {
        animation: fade-up 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .stagger > *:nth-child(1) {
        animation-delay: 0.03s;
      }
      .stagger > *:nth-child(2) {
        animation-delay: 0.09s;
      }
      .stagger > *:nth-child(3) {
        animation-delay: 0.15s;
      }
      .stagger > *:nth-child(4) {
        animation-delay: 0.21s;
      }
      .stagger > *:nth-child(5) {
        animation-delay: 0.27s;

      .stagger > *:nth-child(6) {

      /* ── primitives ── */
      .btn {
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        transition:
          transform 0.12s,

        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
      }
      .btn:active {
        transform: translateY(0) scale(0.985);
      }
      .btn:focus-visible {
        outline: 2px solid var(--cy);
        outline-offset: 2px;
      }
      .btn-pri {
        background: linear-gradient(180deg, var(--cyh), var(--cy));
        color: #1f1605;
        box-shadow: 0 8px 22px rgba(242, 169, 59, 0.18);
        font-size: 13px;
        padding: 10px 20px;
      }
      .btn-pri:hover {
        background: var(--cyh);
        transform: translateY(-1px);
        box-shadow: 0 10px 30px rgba(242, 169, 59, 0.28);
      }
      .btn-violet {
        background: rgba(169, 159, 254, 0.15);
        color: var(--sarah);
        border: 1px solid rgba(169, 159, 254, 0.26);
        box-shadow: 0 4px 18px rgba(169, 159, 254, 0.14);
        font-size: 13px;
        padding: 10px 20px;
      }
      .btn-violet:hover {
        background: rgba(169, 159, 254, 0.22);

      }
      .btn-ghost {
        background: transparent;

        border: 1px solid var(--bm);

        padding: 9px 18px;
      }
      .btn-ghost:hover {
        border-color: var(--bs);

      .btn-sm {
        padding: 6px 13px;
        font-size: 11px;

      .btn:disabled {

      }

      .field {

        background: var(--r);

        transition:
          border-color 0.15s,
          box-shadow 0.15s;

      .hov {

      .b-cy {

      .b-vi {

      .spin {
        width: 15px;

        border: 2px solid rgba(255, 255, 255, 0.12);

      .wvbar {

      code,
      .mono {
        font-family: var(--mono);

      .codechip {
        font-family: var(--mono);

      .api-badge {
        display: inline-flex;

      .md h1,

  <body>
    <div id="root"></div>
    <script>
      const {
        useState,
        useEffect,
        useRef,
        useCallback,
        useMemo,
        createContext,
        useContext,
        Fragment,
      } = React;
      const h = React.createElement;

      /* ════════════════════════════════════════════════════════════
   CONFIG  —  point this at the live NestJS backend.
   Override at runtime: localStorage.setItem('tervlon_api','https://...')
   ════════════════════════════════════════════════════════════ */
      const API_BASE =
        (typeof localStorage !== "undefined" &&
          localStorage.getItem("tervlon_api")) ||
        "http://localhost:3001";
      // Default to fixtures so the file is explorable. Set localStorage.tervlon_demo = "0" for the live API.
      const DEMO =
        typeof localStorage === "undefined"
          ? true
          : localStorage.getItem("tervlon_demo") !== "0";
      const API_MODE = DEMO ? "demo" : "live";

      /* ── token store ── */
      const Tok = {
        get a() {
          return localStorage.getItem("tv_access");
        },
        get r() {
          return localStorage.getItem("tv_refresh");
        },
        get user() {
          try {
            return JSON.parse(localStorage.getItem("tv_user") || "null");
          } catch {
            return null;
          }
        },
        set({ accessToken, refreshToken, user }) {
          if (accessToken) localStorage.setItem("tv_access", accessToken);
          if (refreshToken) localStorage.setItem("tv_refresh", refreshToken);
          if (user) localStorage.setItem("tv_user", JSON.stringify(user));
        },
        clear() {
          ["tv_access", "tv_refresh", "tv_user"].forEach((k) =>
            localStorage.removeItem(k),
          );
        },
      };

      /* ════════════════════════════════════════════════════════════
   API CLIENT  —  wired to the documented Tervlon contract.
   Falls back to fixtures when DEMO is on or the network fails.
   ════════════════════════════════════════════════════════════ */
      async function http(method, path, body, { retry = true } = {}) {
        const headers = { "Content-Type": "application/json" };
        if (Tok.a) headers["Authorization"] = "Bearer " + Tok.a;
        let res;
        try {
          res = await fetch(API_BASE + path, {
            method,
            headers,
            body: body ? JSON.stringify(body) : undefined,
          });
        } catch (netErr) {
          if (DEMO) return Fixtures.handle(method, path, body);
          throw new Error(
            "Network unreachable. Is the backend running at " + API_BASE + "?",
          );
        }
        if (res.status === 401 && retry && Tok.r) {
          const ok = await refreshSession();
          if (ok) return http(method, path, body, { retry: false });
        }
        if (!res.ok) {
          let msg;
          try {
            const j = await res.json();
            msg = j.message || j.error;
          } catch {
            msg = res.statusText;
          }
          throw new Error(
            Array.isArray(msg)
              ? msg.join(", ")
              : msg || "Request failed (" + res.status + ")",
          );
        }
        if (res.status === 204) return null;
        const ct = res.headers.get("content-type") || "";
        return ct.includes("json") ? res.json() : res.text();
      }
      async function refreshSession() {
        try {
          const r = await fetch(API_BASE + "/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refreshToken: Tok.r }),
          });
          if (!r.ok) return false;
          const j = await r.json();
          Tok.set(j);
          return true;
        } catch {
          return false;
        }
      }

      const api = {
        // auth
        login: (email, password) =>
          DEMO
            ? Fixtures.login(email)
            : http("POST", "/auth/login", { email, password }),
        register: (b) =>
          DEMO ? Fixtures.login(b.email) : http("POST", "/auth/register", b),
        me: () => (DEMO ? Promise.resolve(Tok.user) : http("GET", "/auth/me")),
        logout: () =>
          DEMO
            ? Promise.resolve()
            : http("POST", "/auth/logout", { refreshToken: Tok.r }).catch(
                () => {},
              ),
        // catalog + billing
        scenarios: () =>
          DEMO
            ? Fixtures.scenarios()
            : http("GET", "/platform/catalog/scenarios"),
        plans: () =>
          DEMO ? Fixtures.plans() : http("GET", "/platform/billing/plans"),
        wallets: (t, id) =>
          DEMO
            ? Fixtures.wallets()
            : http("GET", `/platform/billing/owners/${t}/${id}/wallets`),
        // developer home — evidence that accrues over time
        devDashboard: (uid) =>
          DEMO
            ? Fixtures.devDashboard()
            : http("GET", `/platform/developers/${uid}/dashboard`),
        sprintHistory: (uid) =>

      function openEventStream(sessionId, onEvent) {
        if (DEMO) {
          return Fixtures.fakeStream(sessionId, onEvent);
        }
        const ctrl = new AbortController();
        (async () => {
          try {
            const res = await fetch(
              `${API_BASE}/runtime/events/session/${sessionId}/stream`,
              {
                headers: { Authorization: "Bearer " + Tok.a },
                signal: ctrl.signal,
              },
            );
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = "";
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              let idx;
              while ((idx = buf.indexOf("\n\n")) >= 0) {
                const chunk = buf.slice(0, idx);
                buf = buf.slice(idx + 2);
                const line = chunk
                  .split("\n")
                  .find((l) => l.startsWith("data:"));
                if (line) {
                  try {
                    const msg = JSON.parse(line.slice(5).trim());
                    onEvent(msg && msg.data ? msg.data : msg);
                  } catch {}
                }
              }
            }
          } catch (e) {
            /* aborted or dropped */
          }
        })();
        return () => ctrl.abort();
      }

      function NotifProvider({ children, onInterrupt }) {
        const [toasts, setToasts] = useState([]); // informational + active
        const push = useCallback(
          (n) => {
            const tier = n.tier || "informational";
            if (tier === "internal") return;
            if (tier === "ambient") return; // ambient lives inline in the activity log, never as a toast
            if (tier === "interrupting") {
              onInterrupt && onInterrupt(n);
              return;
            }
            const id = ++_nid;
            setToasts((t) => [...t, { ...n, id, tier }]);
            if (tier === "informational") setTimeout(() => dismiss(id), 6500);
          },
          [onInterrupt],
        );
        const dismiss = useCallback(
          (id) => setToasts((t) => t.filter((x) => x.id !== id)),
          [],
        );
        return h(
          NotifCtx.Provider,
          { value: { push, dismiss } },
          children,
          h(ToastLayer, { toasts, dismiss }),
        );

      /* ════════════════════════════════════════════════════════════
   FILE TREE  — recursive, builds a real tree from flat paths.
   Selecting a file is the navigation (no tabs). Folders collapse.
   ════════════════════════════════════════════════════════════ */
      const langOf = (path) => {
        const ext = path.split(".").pop().toLowerCase();
        return (
          {
            ts: "TS",
            tsx: "TS",
            js: "JS",
            jsx: "JS",
            json: "{}",
            md: "MD",
            prisma: "P",
            css: "CSS",
            html: "HT",
            yml: "YML",
            yaml: "YML",
          }[ext] || "·"
        );
      };
      const langColor = (path) => {
        const ext = path.split(".").pop().toLowerCase();
        if (["ts", "tsx"].includes(ext)) return "var(--cy)";
        if (["js", "jsx"].includes(ext)) return "var(--warn)";
        if (ext === "json") return "var(--warn)";

      /* ── lightweight TS/JS token highlighter for the editor gutter view ── */
      const KW =

          else if (m[2])

          else if (KW.test(m[3]))

          else if (/^[A-Z]/.test(m[3]))

      /* ════════════════════════════════════════════════════════════

      function Terminal({ sessionId }) {

                  status: r.status,

            "div",
            {

      /* ════════════════════════════════════════════════════════════
   TEAM CHAT  — DMs honoring suggestedDelayMs typing delays.
   ════════════════════════════════════════════════════════════ */
      function TeamChat({ sessionId, liveMessages }) {
        const [msgs, setMsgs] = useState(null);
        const [text, setText] = useState("");
        const [mention, setMention] = useState(null);
        const [typing, setTyping] = useState(null);
        const endRef = useRef(null);
        useEffect(() => {
          api
            .chatMessages(sessionId)
            .then((r) => setMsgs(r.messages || []))
            .catch(() => setMsgs([]));
        }, []);
        useEffect(() => {
          if (liveMessages && liveMessages.length) {
            setMsgs((m) => [...(m || []), ...liveMessages]);
          }
        }, [liveMessages]);
        useEffect(() => {
          endRef.current &&
            endRef.current.scrollIntoView({ behavior: "smooth" });
        }, [msgs, typing]);
        const send = async () => {
          const body = text.trim();
          if (!body) return;
          setMsgs((m) => [...m, { actor: "candidate", body, ts: now() }]);
          setText("");
          try {
            const r = await api.sendChat(sessionId, body, mention);
            setMention(null);
            const replies = r.messages || [];
            for (const rep of replies) {
              const delay = rep.suggestedDelayMs || 1200;
              setTyping(rep.actor);
              await wait(delay);
              setTyping(null);
              setMsgs((m) => [...m, { ...rep, ts: now() }]);
            }
          } catch (e) {
            setMsgs((m) => [
              ...m,
              { actor: "system", body: "Message failed to send.", ts: now() },
            ]);
          }
        };
        return h(
          "div",
          {
            style: {
              flex: 1,
              display: "flex",
              flexDirection: "column",
              minHeight: 0,
            },
          },
          h(
            "div",
            {
              style: {
                flex: 1,
                overflowY: "auto",
                padding: "14px 12px",
                display: "flex",
                flexDirection: "column",
                gap: 12,
              },
            },
            !msgs
              ? h(
                  "div",
                  {
                    style: {
                      color: "var(--tf)",
                      fontSize: 12,

      /* ── minimal, safe markdown renderer (headings, code, lists, inline code) ── */
      function renderMarkdown(src) {
        const blocks = [];
        const lines = src.split("\n");
        let i = 0;
        let key = 0;
        while (i < lines.length) {
          const ln = lines[i];
          if (ln.startsWith("```")) {
            const buf = [];
            i++;
            while (i < lines.length && !lines[i].startsWith("```")) {
              buf.push(lines[i]);
              i++;
            }
            i++;
            blocks.push(
              h("pre", { key: key++ }, h("code", null, buf.join("\n"))),
            );
            continue;
          }
          if (/^#{1,3}\s/.test(ln)) {
            const lvl = ln.match(/^#+/)[0].length;
            blocks.push(
              h("h" + lvl, { key: key++ }, mdInline(ln.replace(/^#+\s/, ""))),
            );
            i++;
            continue;
          }
          if (/^>\s/.test(ln)) {
            blocks.push(
              h(
                "p",
                {
                  key: key++,
                  style: {
                    borderLeft: "2px solid var(--bm)",
                    paddingLeft: 10,
                    color: "var(--tm)",
                    fontStyle: "italic",
                  },
                },
                mdInline(ln.replace(/^>\s/, "")),
              ),
            );
            i++;
            continue;
          }
          if (/^[-*]\s|\[[ x]\]/.test(ln)) {
            const items = [];
            while (i < lines.length && /^[-*]\s/.test(lines[i])) {
              items.push(lines[i].replace(/^[-*]\s/, ""));
              i++;
            }
            blocks.push(
              h(
                "ul",
                { key: key++ },
                items.map((it, j) => h("li", { key: j }, mdInline(it))),
              ),
            );
            continue;
          }
          if (ln.trim() === "") {
            i++;
            continue;
          }
          blocks.push(h("p", { key: key++ }, mdInline(ln)));
          i++;
        }
        return blocks;
      }

      function StandupRoom({ sessionId, mode, onComplete }) {
        const [standup, setStandup] = useState(null);
        const [transcript, setTranscript] = useState([]); // {actor,content}
        const [ui, setUi] = useState({ canReply: false, canWrap: false });
        const [reply, setReply] = useState("");
        const [active, setActive] = useState("sarah");
        const [busy, setBusy] = useState(false);
        const [voice, setVoice] = useState(mode === "voice");
        const tRef = useRef(null);
        useEffect(() => {
          (async () => {
            const j = await api.joinStandup(sessionId);
            setStandup(j.standup);
            setUi(j.ui || { canReply: true });
            setTranscript(
              (j.messages || []).map((m) => ({
                actor: m.actor,
                content: m.content,
              })),
            );
            setActive("sarah");
          })();
        }, []);
        useEffect(() => {
          tRef.current &&
            tRef.current.scrollTo({
              top: tRef.current.scrollHeight,
              behavior: "smooth",
            });
        }, [transcript, busy]);
        const sendTurn = async () => {
          const content = reply.trim();
          if (!content || !standup) return;
          setReply("");
          setBusy(true);
          setTranscript((t) => [...t, { actor: "candidate", content }]);
          setActive("candidate");
          try {
            const r = await api.standupTurn(standup.id, content);
            for (const m of r.messages || []) {
              setActive(m.actor);
              await wait(700);
              setTranscript((t) => [
                ...t,
                { actor: m.actor, content: m.content },
              ]);
            }
            setUi(r.ui || { canReply: true });
            setActive("sarah");
          } catch (e) {
            setTranscript((t) => [
              ...t,
              {
                actor: "system",
                content: "Connection hiccup \u2014 try again.",
              },
            ]);
          } finally {
            setBusy(false);
          }
        };
        const wrap = async () => {
          if (standup) await api.wrapStandup(standup.id);
          onComplete();
        };
        const tiles = ["sarah", "marcus", "priya", "candidate"];
        return h(

      function Radar({ dimensions }) {
        if (!dimensions.length) return null;
        const cx = 150,
          cy = 140,
          R = 98,
          n = dimensions.length;
        const pt = (i, r) => {
          const a = (Math.PI * 2 * i) / n - Math.PI / 2;
          return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
        };
        const [grow, setGrow] = useState(0);
        useEffect(() => {
          const t = setTimeout(() => setGrow(1), 200);
          return () => clearTimeout(t);
        }, []);
        return h(
          "div",
          {
            className: "card",
            style: {
              padding: 20,
              marginTop: 8,
              display: "flex",
              gap: 20,
              alignItems: "center",

          h(
            "svg",
            { width: 300, height: 280, style: { flexShrink: 0 } },
            [0.25, 0.5, 0.75, 1].map((p, gi) =>
              h("polygon", {
                key: gi,
                fill: "none",
                stroke: "rgba(255,255,255,.05)",
                points: dimensions
                  .map((_, i) => pt(i, R * p).join(","))
                  .join(" "),
              }),
            ),
            dimensions.map((_, i) => {
              const [x, y] = pt(i, R);
              return h("line", {
                key: i,
                x1: cx,
                y1: cy,
                x2: x,
                y2: y,
                stroke: "rgba(255,255,255,.06)",
              });
            }),
            h("polygon", {
              fill: "rgba(242,169,59,.14)",
              stroke: "var(--cy)",
              strokeWidth: 1.5,
              strokeLinejoin: "round",
              points: dimensions
                .map((d, i) => pt(i, R * (d.score / 100) * grow).join(","))
                .join(" "),
              style: { transition: "all 1s cubic-bezier(.16,1,.3,1)" },
            }),
            dimensions.map((d, i) => {
              const [x, y] = pt(i, R * (d.score / 100) * grow);
              return h("circle", {
                key: i,
                cx: x,
                cy: y,
                r: 3.5,
                fill: "var(--cy)",
                stroke: "#1f1605",
                strokeWidth: 1.5,
                style: { transition: "all 1s cubic-bezier(.16,1,.3,1)" },
              });
            }),
            dimensions.map((d, i) => {
              const [x, y] = pt(i, R + 20);
              const a = (Math.PI * 2 * i) / n - Math.PI / 2;
              const anchor =
                Math.cos(a) > 0.3
                  ? "start"
                  : Math.cos(a) < -0.3
                    ? "end"
                    : "middle";
              const tone =
                d.score >= 85
                  ? "#5AD19B"
                  : d.score >= 70
                    ? "#F5B544"
                    : "#FF6B7A";
              return h(
                "g",
                { key: i },
                h(
                  "text",
                  {
                    x,
                    y: y - 3,
                    fill: "rgba(200,216,219,.75)",
                    fontSize: 10.5,
                    fontFamily: "DM Sans",
                    textAnchor: anchor,
                    fontWeight: 500,
                  },
                  d.name,
                ),
                h(
                  "text",
                  {
                    x,
                    y: y + 10,
                    fill: tone,
                    fontSize: 10,
                    fontFamily: "JetBrains Mono",
                    textAnchor: anchor,
                    fontWeight: 700,
                  },
                  d.score + "%",
                ),
              );
            }),
          ),
          h(
            "div",
            {
              style: {
                flex: 1,
                fontSize: 12,
                color: "var(--tm)",
                lineHeight: 1.7,
              },
            },
            h(

              {

          ),

      /* ════════════════════════════════════════════════════════════
   WORKSPACE SHELL  — orchestrates the sprint room.
   80% quiet work · 15% ambient presence · 5% interruption.
   ════════════════════════════════════════════════════════════ */
      const DOCKS = [
        ["chat", I.chat, "Team"],
        ["board", I.board, "Board"],
        ["reference", I.book, "Refs"],
        ["support", I.help, "Help"],
      ];
      function Workspace({ session, scenario, onExit, onReport }) {
        const sid = session.id;
        const [state, setState] = useState(null);
        const [contract, setContract] = useState(null);
        const [files, setFiles] = useState([]);
        const [active, setActive] = useState(null);
        const [ticketOpen, setTicketOpen] = useState(true);
        const [dock, setDock] = useState("chat");
        const [saveState, setSaveState] = useState("");
        const [overlay, setOverlay] = useState(null); // 'checks'|'review'
        const [standup, setStandup] = useState(null); // 'incoming'|'voice'|'text'
        const [liveChat, setLiveChat] = useState([]);
        const [elapsed, setElapsed] = useState(0);
        const [activity, setActivity] = useState([]); // ambient inline log
        const notif = useNotif();
        const saveTimer = useRef(null);
        const t0 = useRef(Date.now());

        useEffect(() => {
          api
            .frontendContract(sid)
            .then((r) => {
              const c = r.contract || r;
              setContract(c);
              if (c.layoutPriority === "standup_incoming") setStandup("incoming");
              if (c.layoutPriority === "standup_meeting") setStandup("text");
            })
            .catch(() => setContract(null));
          api
            .state(sid)
            .then((s) => {
              setState(s);
              setFiles(s.files || []);
              const main =
                (s.files || []).find((f) => /auth\.guard\.ts$/.test(f.path)) ||
                (s.files || [])[0];
              setActive(main?.path || null);
            })
            .catch(
              (e) =>
                notif &&
                notif.push({
                  tier: "active",
                  title: "Could not load sprint",
                  body: e.message,
                }),
            );
        }, [sid]);

        useEffect(() => {
          const t = setInterval(
            () => setElapsed(Math.floor((Date.now() - t0.current) / 1000)),
            1000,
          );
          return () => clearInterval(t);
        }, []);

        // SSE — render strictly by tier
        useEffect(() => {
          const close = openEventStream(sid, (ev) => {
            const tier = ev.payload?.tier || ev.tier || "internal";
            if (tier === "ambient") {
              setActivity((a) => [
                ...a.slice(-20),
                { type: ev.type, text: ambientText(ev), at: now() },
              ]);
            } else if (
              tier === "interrupting" ||
              ev.type === "standup.incoming"
            ) {
              setStandup("incoming");
            } else if (tier === "informational" || tier === "active") {
              if (ev.type === "teammate.message") {
                setLiveChat((c) => [
                  ...c,
                  {
                    actor: ev.payload.actor,
                    body: ev.payload.body,
                    ts: now(),
                    suggestedDelayMs: ev.payload.suggestedDelayMs,
                  },
                ]);
              }
              notif &&
                notif.push({
                  tier,
                  title:
                    ev.payload?.title ||
                    who(ev.payload?.actor || "system").name,
                  body: ev.payload?.body,
                  avatar: ev.payload?.actor,
                  accent: `var(--${ev.payload?.actor || "cy"})`,
                });
            }
          });
          return close;
        }, [sid]);

        const fileObj = files.find((f) => f.path === active) || null;
        const onEdit = (content) => {
          setFiles((fs) =>
            fs.map((f) => (f.path === active ? { ...f, content } : f)),
          );
          setSaveState("saving");
          clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(async () => {
            try {
              await api.writeFile(sid, {
                path: active,
                language: fileObj?.language || "typescript",
                content,
              });
              setSaveState("saved");
              setTimeout(() => setSaveState(""), 1500);
            } catch {
              setSaveState("");
            }
          }, 650);
        };
        const newFile = () => {
          const path = prompt("New file path (e.g. src/utils/jwt.ts)");
          if (!path) return;
          setFiles((fs) => [
            ...fs,
            { path, language: "typescript", content: "" },
          ]);
          setActive(path);
        };
        const ticket = state?.currentTicket;
        const tickets = state?.softwareTicketRuns || [];
        const layoutPriority =
          contract?.layoutPriority?.replace(/_/g, " ") || "workspace";
        const connectionLabel = DEMO
          ? "Demo contract"
          : contract
            ? "Live contract"
            : "Engine snapshot";

        return h(
          "div",
          {
            style: {
              height: "100%",
              display: "flex",
              flexDirection: "column",
              filter: standup === "incoming" ? "brightness(.5)" : "none",
              transition: "filter .4s",
            },
          },
          // ── top bar ──
          h(
            "div",
            {
              style: {
                display: "flex",
                alignItems: "center",
                height: 48,
                padding: "0 14px",
                background: "var(--s)",
                borderBottom: "1px solid var(--bo)",
                flexShrink: 0,
                gap: 0,
              },
            },
            h(
              "div",
              {
                style: {
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  width: 246,
                  flexShrink: 0,
                },
              },
              h(Wordmark, { size: 13 }),
              h("div", {
                style: { width: 1, height: 16, background: "var(--bm)" },
              }),
              h(
                "button",
                {
                  onClick: () => setTicketOpen((o) => !o),
                  className: "btn btn-sm",
                  style: {
                    background: ticketOpen ? "var(--cyd)" : "transparent",
                    color: "var(--cy)",
                    border: `1px solid ${ticketOpen ? "rgba(242,169,59,.3)" : "var(--bm)"}`,
                    padding: "5px 10px",
                  },
                },
                [
                  h(I.board, { key: 1, size: 11 }),
                  ticket?.ticketId || "Ticket",
                ],
              ),
            ),
            h(ProgressRail, {
              tickets,
              current: state?.session?.currentTicketId,
            }),
            h(
              "div",
              {
                style: {
                  display: "flex",
                  alignItems: "center",
                  gap: 12,
                  width: 332,
                  justifyContent: "flex-end",
                  flexShrink: 0,
                },
              },
              h(ApiModeBadge, { compact: true, contract }),
              h(
                "div",
                { style: { textAlign: "right" } },
                h(
                  "div",
                  {
                    style: {
                      fontSize: 8.5,
                      color: "var(--tg)",
                      textTransform: "uppercase",
                      letterSpacing: ".06em",
                    },
                  },
                  "Elapsed",
                ),
                h(
                  "div",
                  {
                    className: "mono",
                    style: { fontSize: 12, color: "var(--tm)" },
                  },
                  fmtTime(elapsed),
                ),
              ),
              h(
                "div",
                { style: { display: "flex", alignItems: "center", gap: 5 } },
                h("div", {
                  style: {
                    width: 7,
                    height: 7,
                    borderRadius: "50%",
                    background: "var(--ok)",
                    animation: "pulse-ring 2s infinite",
                    "--ring": "rgba(90,209,155,.5)",
                  },
                }),
                h(
                  "span",
                  { style: { fontSize: 10, color: "var(--ok)" } },
                  "Live",
                ),
              ),
              h(
                "button",
                { className: "btn btn-ghost btn-sm", onClick: onExit },
                [h(I.exit, { key: 1, size: 12 }), "Exit"],
              ),
              h(Avatar, { actor: "candidate", size: 28 }),
            ),
          ),
          // ── body ──
          h(
            "div",
            { style: { flex: 1, display: "flex", minHeight: 0 } },
            ticketOpen &&
              h(TicketPanel, { ticket, onClose: () => setTicketOpen(false) }),
            state &&
              h(FileTree, {
                files,
                activePath: active,
                onSelect: setActive,
                onCreate: newFile,
              }),
            // center: editor + terminal
            h(
              "div",
              {
                style: {
                  flex: 1,
                  display: "flex",
                  flexDirection: "column",
                  minWidth: 0,
                },
              },
              h(
                "div",
                {
                  style: {
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "flex-end",
                    gap: 8,
                    height: 38,
                    padding: "0 12px",
                    borderBottom: "1px solid var(--bo)",
                    background: "var(--s)",
                    flexShrink: 0,
                  },
                },
                h(
                  "div",
                  {
                    style: {
                      flex: 1,
                      fontSize: 10.5,
                      color: "var(--tf)",
                      display: "flex",
                      alignItems: "center",
                      gap: 6,
                    },
                  },
                  activity.length > 0 && [
                    h(I.dot, {
                      key: 1,
                      size: 7,
                      style: { color: "var(--ok)" },
                    }),
                    activity[activity.length - 1].text,
                  ],
                ),
                h(
                  "button",
                  {
                    className: "btn btn-ghost btn-sm",
                    onClick: () => setOverlay("checks"),
                  },
                  [
                    h(I.play, { key: 1, size: 11, stroke: "var(--ok)" }),
                    "Run checks",
                  ],
                ),
                h(
                  "button",
                  {
                    className: "btn btn-pri btn-sm",
                    onClick: () => setOverlay("checks"),
                  },
                  [h(I.arrow, { key: 1, size: 12 }), "Submit ticket"],
                ),
              ),
              h(
                "div",
                {
                  style: {
                    flex: 1,
                    display: "flex",
                    flexDirection: "column",
                    minHeight: 0,
                  },
                },
                h(
                  "div",
                  { style: { flex: 1.7, minHeight: 0, display: "flex" } },
                  h(Editor, { file: fileObj, onChange: onEdit, saveState }),
                ),
                h("div", {
                  style: { height: 5, background: "var(--bo)", flexShrink: 0 },
                }),
                h(
                  "div",
                  { style: { flex: 1, minHeight: 120, maxHeight: "40%" } },
                  h(Terminal, { sessionId: sid }),
                ),
              ),
            ),
            // right dock
            h(
              "div",
              {
                style: {
                  width: 312,
                  background: "var(--s)",
                  borderLeft: "1px solid var(--bo)",
                  display: "flex",
                  flexDirection: "column",
                  flexShrink: 0,
                },
              },
              h(
                "div",
                {
                  style: {
                    display: "flex",
                    height: 42,
                    borderBottom: "1px solid var(--bo)",
                    flexShrink: 0,
                  },
                },
                DOCKS.map(([k, icon, label]) =>
                  h(
                    "button",
                    {
                      key: k,
                      onClick: () => setDock(k),
                      style: {
                        flex: 1,
                        background: "none",
                        border: "none",
                        cursor: "pointer",
                        fontFamily: "inherit",
                        borderBottom: `2px solid ${dock === k ? "var(--cy)" : "transparent"}`,
                        color: dock === k ? "var(--ts)" : "var(--tf)",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        gap: 5,
                        fontSize: 11,
                        fontWeight: 600,
                      },
                    },
                    h(icon, { size: 14 }),
                    label,
                  ),
                ),
              ),
              dock === "chat" &&
                h(TeamChat, { sessionId: sid, liveMessages: liveChat }),
              dock === "board" && h(Board, { board: state?.currentBoard }),
              dock === "reference" && h(References, { sessionId: sid }),
              dock === "support" &&
                h(Support, { sessionId: sid, onTeammatePair: setDock }),
            ),
          ),
          // ── status bar ──
          h(
            "div",
            {
              style: {
                display: "flex",
                alignItems: "center",
                height: 22,
                padding: "0 12px",
                background: "var(--cy)",
                flexShrink: 0,
                gap: 14,
              },
            },
            h(
              "span",
              { style: { fontSize: 9, fontWeight: 600, color: "#1f1605" } },
              connectionLabel,
            ),
            h(
              "span",
              { style: { fontSize: 9, color: "rgba(6,18,26,.6)" } },
              sid,
            ),
            h(
              "span",
              { style: { fontSize: 9, color: "rgba(6,18,26,.65)" } },
              layoutPriority,
            ),
            h("div", { style: { flex: 1 } }),
            active &&
              h(
                "span",
                {
                  className: "mono",
                  style: { fontSize: 9, color: "rgba(6,18,26,.7)" },
                },
                active.split("/").pop(),
              ),
            h(
              "span",
              { style: { fontSize: 9, color: "rgba(6,18,26,.7)" } },
              "TypeScript",
            ),
          ),
          // ── overlays ──
          overlay === "checks" &&
            h(ChecksOverlay, {
              sessionId: sid,
              onClose: () => setOverlay(null),
              onReview: () => setOverlay("review"),
            }),
          overlay === "review" &&
            h(ReviewOverlay, {
              sessionId: sid,
              onClose: () => setOverlay(null),
              onWrap: () => {
                setOverlay(null);
                setTimeout(() => setStandup("incoming"), 700);
              },
            }),
          standup === "incoming" &&
            h(StandupIncoming, {
              onJoinVoice: () => setStandup("voice"),
              onJoinText: () => setStandup("text"),
              onDelay: () => {
                api.delayStandup(sid);
                setStandup(null);
                notif &&
                  notif.push({
                    tier: "informational",
                    title: "Standup delayed once",
                    body: "Sarah will call again shortly.",
                    avatar: "sarah",
                  });
              },
            }),
          (standup === "voice" || standup === "text") &&
            h(StandupRoom, {
              sessionId: sid,
              mode: standup,
              onComplete: () => {
                setStandup(null);
                onReport(sid);
              },
            }),
        );
      }
      function ProgressRail({ tickets, current }) {
        if (!tickets.length) return h("div", { style: { flex: 1 } });
        return h(
          "div",
          {
            style: {
              flex: 1,
              display: "flex",
              justifyContent: "center",
              alignItems: "center",
            },
          },
          h(
            "div",
            { style: { display: "flex", alignItems: "center" } },
            tickets.map((t, i) => {
              const done = t.status === "PASSED";
              const isCur = t.ticketId === current;
              return h(
                Fragment,
                { key: t.ticketId },
                i > 0 &&
                  h("div", {
                    style: {
                      width: 26,
                      height: 1.5,
                      marginBottom: 13,
                      background: done ? "var(--ok)" : "var(--bm)",
                      opacity: done ? 0.6 : 1,
                    },
                  }),
                h(
                  "div",
                  {
                    style: {
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 3,
                    },
                  },
                  h(
                    "div",
                    {
                      style: {
                        width: isCur ? 24 : 20,
                        height: isCur ? 24 : 20,
                        borderRadius: "50%",
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        background: done
                          ? "var(--ok)"
                          : isCur
                            ? "var(--cy)"
                            : "var(--p)",
                        border:
                          done || isCur ? "none" : "1.5px solid var(--bs)",
                        animation: isCur ? "pulse-ring 2.5s infinite" : "none",
                        "--ring": "rgba(242,169,59,.45)",
                      },
                    },
                    done
                      ? h(I.check, { size: 10, stroke: "#1f1605", sw: 2.4 })
                      : h(
                          "span",
                          {
                            style: {
                              fontSize: isCur ? 10 : 9,
                              fontWeight: 700,
                              color: isCur ? "#1f1605" : "var(--tf)",
                            },
                          },
                          i + 1,
                        ),
                  ),
                  h(
                    "span",
                    {
                      style: {
                        fontSize: 7.5,
                        fontWeight: isCur ? 700 : 500,
                        letterSpacing: ".04em",
                        color: done
                          ? "rgba(90,209,155,.6)"
                          : isCur
                            ? "var(--cy)"
                            : "var(--tg)",
                      },
                    },
                    t.ticketId,
                  ),
                ),
              );
            }),
          ),
        );
      }
      function ambientText(ev) {
        if (ev.type === "sandbox.dev_server_started")
          return `dev server running on :${ev.payload?.port || 5173}`;
        if (ev.type === "board.moved")
          return ev.payload?.title || "board updated";
        if (ev.type === "file.written") return "file saved";
        return ev.type;
      }
      const fmtTime = (s) =>
        `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

      /* ============================ APP / ROUTER ============================ */
      function Shell({ children, onInterrupt }) {
        return h(NotifProvider, { onInterrupt }, children);
      }

      function App() {
        // route: 'boot' | 'auth' | 'dashboard' | 'workspace' | 'report'
        const [route, setRoute] = useState("boot");
        const [user, setUser] = useState(null);
        const [session, setSession] = useState(null);
        const [scenario, setScenario] = useState(null);
        const [reportSid, setReportSid] = useState(null);
        const [entering, setEntering] = useState(false);
        const [bootErr, setBootErr] = useState("");

        // boot: restore session
        useEffect(() => {
          (async () => {
            if (DEMO) {
              const u = Tok.user;
              if (u) {
                setUser(u);
                setRoute("dashboard");
              } else {
                setRoute("auth");
              }
              return;
            }
            if (!Tok.a) {
              setRoute("auth");
              return;
            }
            try {
              const me = await api.me();
              setUser(me?.user || me);
              setRoute("dashboard");
            } catch (e) {
              Tok.clear();
              setRoute("auth");
            }
          })();
        }, []);

        const onAuthed = (u) => {
          setUser(u);
          setRoute("dashboard");
        };
        const onLogout = async () => {
          try {
            await api.logout();
          } catch {}
          Tok.clear();
          setUser(null);
          setSession(null);
          setRoute("auth");
        };

        const onEnter = async (s, resumeAttemptId) => {
          setEntering(true);
          try {
            let attemptId = resumeAttemptId;
            if (!attemptId) {
              const att = await api.createAttempt(s.slug);
              attemptId = att.attempt?.id || att.attemptId || att.id;
            }
            const sess = resumeAttemptId
              ? await api.resumeAttempt(attemptId).catch(() => api.startSession(attemptId))
              : await api.startSession(attemptId);
            const sObj = sess.session || sess;
            setScenario(s);
            setSession(sObj);
            setRoute("workspace");
          } catch (e) {
            alert("Could not start the sprint: " + (e.message || e));
          } finally {
            setEntering(false);
          }
        };

        const onReport = (sid) => {
          setReportSid(sid || session?.id);
          setRoute("report");
        };
        const onExit = () => {
          setSession(null);
          setScenario(null);
          setRoute("dashboard");
        };
        const onReportDone = () => {
          setSession(null);
          setScenario(null);
          setReportSid(null);
          setRoute("dashboard");
        };

        let body;
        if (route === "boot") body = h(BootScreen, { err: bootErr });
        else if (route === "auth") body = h(AuthScreen, { onAuthed });
        else if (route === "dashboard")
          body = h(Dashboard, { user, onEnter, onLogout });
        else if (route === "workspace" && session)
          body = h(Workspace, { session, scenario, onExit, onReport });
        else if (route === "report")
          body = h(Report, { sessionId: reportSid, onDone: onReportDone });
        else body = h(BootScreen, { err: "Lost the thread. Returning home." });

        return h(
          Shell,
          { onInterrupt: null },
          body,
          entering && h(EnterOverlay, { scenario }),
        );
      }

      function BootScreen({ err }) {
        return h(
          "div",
          {
            style: {
              height: "100%",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              gap: 18,
            },
          },
          h("div", {
            style: {
              animation: "spin 1s linear infinite",
              width: 26,
              height: 26,
              borderRadius: "50%",
              border: "2.5px solid var(--bs)",
              borderTopColor: "var(--cy)",
            },
          }),
          h(
            "span",
            {
              style: {
                fontSize: 12,
                color: "var(--tg)",
                letterSpacing: ".04em",
              },
            },
            err || "Warming up the room",
          ),
        );
      }

      function EnterOverlay({ scenario }) {
        return h(
          "div",
          {
            style: {
              position: "fixed",
              inset: 0,
              zIndex: 200,
              background: "rgba(7,7,13,.86)",
              backdropFilter: "blur(10px)",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              gap: 20,
              animation: "fade-in .25s ease",
            },
          },
          h("div", {
            style: {
              animation: "spin 1s linear infinite",
              width: 30,
              height: 30,
              borderRadius: "50%",
              border: "3px solid var(--bs)",
              borderTopColor: "var(--cy)",
            },
          }),
          h(
            "div",
            { style: { textAlign: "center" } },
            h(
              "div",
              {
                style: {
                  fontFamily: "var(--serif)",
                  fontSize: 22,
                  marginBottom: 6,
                },
              },
              "Joining the team",
            ),
            h(
              "div",
              { style: { fontSize: 12, color: "var(--tg)" } },
              scenario?.title
                ? `${scenario.title} · the sprint is already in motion`
                : "Pulling the active ticket",
            ),
          ),
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(h(App));
    </script>
  </body>
</html>
